[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-deepfake-shield"
version = "0.1.0"
description = "Phase 0 Validation Spike & Core v2 Cross-Channel Anti-Scam Engine for Elderly Protection"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
desktop = [
    "opencv-python-headless>=4.9.0",
    "mss>=9.0.1",
    "scipy>=1.12.0",
    "pillow>=11.0.0",
    "pyaudiowpatch>=0.2.12.6; platform_system == 'Windows'",
]
backend = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]
onnx = [
    "onnxruntime>=1.19.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
